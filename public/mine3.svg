<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Background grid -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e63d8" opacity="0.1" />
    </pattern>
    <linearGradient id="bgGradient" x1="0" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b5b9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d5225" />
      <stop offset="100%" stop-color="#142610" />
    </linearGradient>
    
    <radialGradient id="rubberGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3d3a" />
      <stop offset="100%" stop-color="#181a18" />
    </radialGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#dotPattern)"/>
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <g transform="translate(300, 410) scale(0.85)" filter="url(#shadow)">
    <!-- Body of PMN-2 (Isometric tilt) -->
    <ellipse cx="0" cy="20" rx="140" ry="70" fill="#142610" />
    
    <!-- Side wall -->
    <path d="M-140,-20 L-140,20 A140,70 0 0,0 140,20 L140,-20 A140,70 0 0,1 -140,-20 Z" fill="url(#greenGrad)" />
    
    <!-- Side arming mechanism (arming key slot) -->
    <path d="M-140,0 L-170,10 L-170,25 L-140,15 Z" fill="#444" stroke="#222" stroke-width="2"/>
    <ellipse cx="-170" cy="17.5" rx="5" ry="10" fill="#222" />

    <!-- Top surface border -->
    <ellipse cx="0" cy="-20" rx="140" ry="70" fill="#2d5225" stroke="#142610" stroke-width="3" />
    <ellipse cx="0" cy="-20" rx="125" ry="62" fill="#1e3818" />

    <!-- Black rubber cross top -->
    <ellipse cx="0" cy="-20" rx="115" ry="57" fill="url(#rubberGrad)" stroke="#111" stroke-width="2" />
    
    <!-- Cross indents -->
    <path d="M-90,-20 L90,-20 M0,-65 L0,25" stroke="#111" stroke-width="25" stroke-linecap="round" opacity="0.6"/>
    <path d="M-85,-20 L85,-20 M0,-60 L0,20" stroke="#444" stroke-width="15" stroke-linecap="round" />
    
    <ellipse cx="0" cy="-20" rx="25" ry="12" fill="#222" stroke="#111" stroke-width="2" />
    <ellipse cx="0" cy="-20" rx="15" ry="7" fill="#444" />
  </g>
</svg>
