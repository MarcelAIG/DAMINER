<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Background grid -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e63d8" opacity="0.1" />
    </pattern>
    <linearGradient id="bgGradient" x1="0" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b5b9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    
    <!-- 3D Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5540" />
      <stop offset="100%" stop-color="#2c3326" />
    </linearGradient>
    <radialGradient id="fuzeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#808a74" />
      <stop offset="100%" stop-color="#3b4433" />
    </radialGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#dotPattern)"/>
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <g transform="translate(300, 400) scale(0.8) rotate(-15)" filter="url(#shadow)">
    <!-- Butterfly PFM-1 body with realistic curves -->
    <path d="M-120,-30 C-220,-120 -250,-20 -180,30 C-110,80 -40,120 0,60 C40,0 120,-40 180,20 C240,80 200,-150 120,-50 C40,50 0,60 -60,10 Z" fill="url(#bodyGrad)" stroke="#2c3326" stroke-width="2" />
    
    <!-- Inner contours to show thickness -->
    <path d="M-100,-20 C-180,-90 -210,-10 -150,30 C-90,70 -30,100 0,50" fill="none" stroke="#606c54" stroke-width="4" stroke-linecap="round" />
    
    <!-- Thick central cylinder (liquid explosive section) -->
    <ellipse cx="-40" cy="15" rx="50" ry="25" transform="rotate(35 -40 15)" fill="#3b4433" />
    <ellipse cx="-40" cy="15" rx="45" ry="20" transform="rotate(35 -40 15)" fill="url(#fuzeGrad)" />
    
    <!-- Small fuze detail -->
    <circle cx="130" cy="-30" r="18" fill="#1f2937" />
    <circle cx="130" cy="-30" r="10" fill="#4b5563" />
    <path d="M120,-30 L140,-30 M130,-40 L130,-20" stroke="#1f2937" stroke-width="3" />
  </g>
</svg>
