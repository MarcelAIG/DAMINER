<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Background grid -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e63d8" opacity="0.1" />
    </pattern>
    <linearGradient id="bgGradient" x1="0" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b5b9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Gradients -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555e51" />
      <stop offset="50%" stop-color="#3d443a" />
      <stop offset="100%" stop-color="#252a23" />
    </linearGradient>
    <radialGradient id="topGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#677262" />
      <stop offset="80%" stop-color="#495245" />
      <stop offset="100%" stop-color="#2b3129" />
    </radialGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#dotPattern)"/>
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <g transform="translate(300, 420) scale(0.8)" filter="url(#shadow)">
    <!-- Main cylinder body for TM-46 -->
    <!-- Bottom base -->
    <ellipse cx="0" cy="15" rx="200" ry="75" fill="#1b1f1a" />
    
    <!-- Side wall with vertical ribs -->
    <path d="M-200,-40 L-200,15 A200,75 0 0,0 200,15 L200,-40 A200,75 0 0,1 -200,-40 Z" fill="url(#metalGrad)" />
    
    <!-- Ribs -->
    <path d="M-180,-30 L-180,25 M-140,-20 L-140,35 M-100,-10 L-100,45 M-60,-5 L-60,50 M-20,0 L-20,55 M20,0 L20,55 M60,-5 L60,50 M100,-10 L100,45 M140,-20 L140,35 M180,-30 L180,25" stroke="#1f241d" stroke-width="4" fill="none" opacity="0.6"/>

    <!-- Top surface -->
    <ellipse cx="0" cy="-40" rx="200" ry="75" fill="url(#topGrad)" stroke="#2b3129" stroke-width="2" />
    
    <!-- Stepped inner rings -->
    <ellipse cx="0" cy="-40" rx="160" ry="60" fill="#3d443a" stroke="#252a23" stroke-width="3" />
    <ellipse cx="0" cy="-40" rx="150" ry="56" fill="url(#topGrad)" />
    
    <!-- Central fuze / Pressure plate -->
    <ellipse cx="0" cy="-40" rx="60" ry="22" fill="#292929" stroke="#111" stroke-width="4" />
    <ellipse cx="0" cy="-44" rx="55" ry="20" fill="#555" />
    <circle cx="0" cy="-44" r="15" fill="#333" />
    <circle cx="0" cy="-44" r="5" fill="#ff4444" />
    
    <!-- Side carrying handle -->
    <path d="M-195,0 C-240,-10 -240,-30 -195,-40" fill="none" stroke="#3d443a" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
